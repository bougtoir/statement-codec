name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover
      - run: python3 test_v6.py && python3 test_bench.py && python3 test_bench_v12.py && python3 test_analysis.py
      - run: python3 bench_v12.py > /tmp/b12.json && diff /tmp/b12.json reproducibility/bench_v12_out.json
      - run: python3 bench_v16.py > /tmp/b16.json && diff /tmp/b16.json reproducibility/bench_v16_out.json
